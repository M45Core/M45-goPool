# Go benchmark pool registry for local comparison runs.
#
# This overlay keeps the comparison intentionally focused on goPool, pogolo,
# ckpool, WarpPool, public-pool, and Erikslund. It is copied over the upstream
# harness by scripts/go-benchmark-env.sh.

regtest:
  rpc_user: openbench
  rpc_pass: openbenchpass
  rpc_port: 18443
  bitcoind_container: bitcoind
  network: openbench-regtest_default
  compose_project: openbench-regtest
  address: bcrt1qlk935ze2fsu86zjp395uvtegztrkaezawxx0wf

pinning:
  enabled: true
  bitcoind_cpus: "0"
  pool_cpus: "1"
  bench_cpus: "2"

profiles:
  validation:
    difficulty: 0.001
    min_difficulty: 0.0001
    max_difficulty: 1000000
    coinbase_tag: /openbench/
  mine:
    difficulty: 1
    min_difficulty: 0.0001
    max_difficulty: 1000000
    coinbase_tag: /openbench/

pools:
  gopool:
    description: M45Core/M45-goPool (Go solo pool)
    source: build
    build_context: pools/gopool/src
    dockerfile: pools/gopool/Dockerfile
    stratum_port: 3333
    config:
      format: toml
      template: pools/gopool/bench.toml
      mount: /openbench/gopool.toml
    readiness:
      kind: tcp
      timeout_seconds: 90

  pogolo:
    description: 0xf0xx0/pogolo v1.1.4-hotfix (Go solo pool)
    source: image
    image: 0xf0xx0/pogolo:v1.1.4-hotfix
    stratum_port: 5661
    api_port: 5662
    config:
      format: toml
      template: pools/pogolo/bench.toml
      mount: /config/pogolo.toml
    readiness:
      kind: http
      url: http://${POOL_HOST}:${API_PORT}/api/v1/info
      status: 200
      timeout_seconds: 40

  ckpool:
    description: ckolivas/ckpool v1.2.0 (C solo pool, BTCSOLO mode)
    source: build
    build_context: pools/ckpool
    dockerfile: Dockerfile
    stratum_port: 3333
    config:
      format: json
      template: pools/ckpool/bench.conf
      mount: /config/ckpool.conf
    readiness:
      kind: tcp
      timeout_seconds: 120

  warppool:
    description: dvb-projekt/dvb-WarpPool main (Rust solo pool)
    source: build
    repo: https://git.warppool.org/dvb-projekt/dvb-WarpPool.git
    repo_ref: main
    repo_dir: pools/warppool/src
    build_context: pools/warppool/src
    dockerfile: pools/warppool/Dockerfile
    stratum_port: 3333
    api_port: 18334
    env:
      WARPPOOL_RPC_USER: ${RPC_USER}
      WARPPOOL_RPC_PASS: ${RPC_PASS}
    config:
      format: toml
      template: pools/warppool/bench.toml
      mount: /config/config.toml
    readiness:
      kind: http
      url: http://${POOL_HOST}:${API_PORT}/readyz
      status: 200
      timeout_seconds: 120

  public-pool:
    description: benjamin-wilson/public-pool master (TypeScript/Node solo pool)
    source: build
    build_context: ../public-pool
    repo: https://github.com/benjamin-wilson/public-pool.git
    repo_ref: master
    dockerfile: pools/public-pool/Dockerfile
    stratum_port: 3333
    api_port: 3334
    env:
      NODE_ENV: production
    config:
      format: env
      template: pools/public-pool/bench.env
      mount: /public-pool/.env
    readiness:
      kind: tcp
      timeout_seconds: 150

  erikslund-cpp:
    description: Erikslund-net/erikslund-solo-pool main (C++26 solo pool)
    source: build
    repo: https://github.com/Erikslund-net/erikslund-solo-pool.git
    repo_ref: main
    repo_dir: pools/erikslund-cpp/src
    build_context: pools/erikslund-cpp/src
    dockerfile: Dockerfile
    stratum_port: 3333
    api_port: 7777
    config:
      format: yaml
      template: pools/erikslund-cpp/bench.yml
      mount: /etc/erikslund-pool/pool.yml
    readiness:
      kind: http
      url: http://${POOL_HOST}:${API_PORT}/health
      status: 200
      body: ok
      timeout_seconds: 60
